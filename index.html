.login-wrap{min-height:100vh;background:var(--black);display:flex;align-items:center;justify-content:center;padding:1rem}
.login-box{background:#111;border:1px solid #333;border-radius:16px;padding:36px 28px;width:100%;max-width:400px;text-align:center}
.logo-circle{width:180px;height:90px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:#000;border-radius:12px;overflow:hidden}
.login-title{font-size:22px;font-weight:700;color:#fff;letter-spacing:.08em}
.login-sub{font-size:12px;color:var(--g400);margin:4px 0 28px}
.f{margin-bottom:14px;text-align:left}
.f label{display:block;font-size:12px;color:#aaa;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--g200);border-radius:var(--rs);padding:9px 11px;font-size:14px;background:#fff;color:var(--g800);font-family:inherit;transition:border .15s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--g600)}
.f textarea{resize:vertical;min-height:68px}
.f input[style*="background:#1a1a1a"]{background:#1a1a1a!important;border-color:#333!important;color:#fff!important}
.btn-login{width:100%;background:#fff;color:#000;border:none;border-radius:var(--rs);padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-login:hover{background:#eee}
.login-err{color:#f87171;font-size:13px;margin-top:10px;min-height:20px}
.app{display:none;min-height:100vh}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
.overlay.show{display:block}
.sidebar{width:220px;background:var(--black);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .25s;overflow-y:auto}
.sidebar.closed{transform:translateX(-220px)}
.sb-logo{padding:22px 18px 14px;border-bottom:1px solid #222}
.sb-circle{width:104px;height:52px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;overflow:hidden}
.sb-name{font-size:17px;font-weight:700;letter-spacing:.1em}
.sb-min{font-size:9px;color:var(--g400);letter-spacing:.08em}
.nav-sec{padding:10px 0 2px}
.nav-lbl{font-size:9px;color:var(--g400);letter-spacing:.12em;padding:0 18px 5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 18px;font-size:13px;color:#ccc;cursor:pointer;border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{background:#111;color:#fff}
.nav-item.active{background:#111;color:#fff;border-left-color:#fff}
.nav-icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sb-user{padding:14px 18px;margin-top:auto;border-top:1px solid #222}
.sb-user-info{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sb-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid #333;flex-shrink:0}
.sb-avatar-placeholder{width:34px;height:34px;border-radius:50%;background:#222;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#aaa;flex-shrink:0}
.sb-user-name{font-size:12px;font-weight:600;color:#fff}
.sb-user-role{font-size:11px;color:var(--g400);margin-top:1px}
.btn-logout{background:none;border:none;color:#666;font-size:11px;cursor:pointer;padding:0}
.btn-logout:hover{color:#aaa}
.main{min-height:100vh}
.main.pushed{margin-left:220px}
.topbar{background:#fff;border-bottom:1px solid var(--g200);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:10px}
.menu-btn{background:none;border:1px solid var(--g200);border-radius:var(--rs);padding:6px 10px;font-size:18px;cursor:pointer;line-height:1}
.page-title{font-size:15px;font-weight:600}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge-black{background:var(--black);color:#fff}
.badge-gray{background:var(--g100);color:var(--g600)}
.badge-green{background:#e6f4ea;color:#1a7a2e}
.badge-amber{background:#fef3cd;color:#856404}
.badge-blue{background:#e8f0fe;color:#1a56db}
.badge-red{background:#fce8e8;color:#c00}
.content{padding:16px;max-width:100%}
@media(min-width:600px){.content{padding:24px;max-width:960px}}
.card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:500px){.metric-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}}
.metric{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:14px}
.metric-label{font-size:11px;color:var(--g400);margin-bottom:3px}
.metric-value{font-size:24px;font-weight:700}
.metric-sub{font-size:11px;color:var(--g400);margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:500px){.form-row{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--black);color:#fff}
.btn-primary:hover{background:#222}
.btn-secondary{background:#fff;color:var(--g800);border-color:var(--g200)}
.btn-secondary:hover{background:var(--g50)}
.btn-danger{background:#fff0f0;color:#c00;border-color:#fcc}
.btn-danger:hover{background:#ffe0e0}
.btn-wpp{background:#25D366;color:#fff;border:none}
.btn-wpp:hover{background:#1da851}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-full{width:100%;justify-content:center}
.sec-actions{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.sec-actions h2{font-size:17px;font-weight:600}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:360px}
th{text-align:left;font-size:10px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;padding:9px 12px;border-bottom:1px solid var(--g200);background:var(--g50);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--g100);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}
.td-name{font-weight:500}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0}
.modal-overlay.hidden{display:none}
@media(min-width:600px){.modal-overlay{align-items:center;padding:1rem}}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-height:90vh;overflow-y:auto}
@media(min-width:600px){.modal{border-radius:var(--r);max-width:520px;max-height:85vh}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:15px;font-weight:600}
.btn-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--g400);padding:0;line-height:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:#fff;padding:11px 20px;border-radius:var(--rs);font-size:13px;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chart-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chart-label{font-size:11px;color:var(--g400);width:60px;text-align:right;flex-shrink:0}
.chart-bg{flex:1;background:var(--g100);border-radius:3px;height:16px;overflow:hidden}
.chart-fill{height:100%;background:var(--black);border-radius:3px;transition:width .6s}
.chart-val{font-size:11px;font-weight:600;width:40px;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}
.dot-recepcao{background:#3b82f6}.dot-estacionamento{background:#6366f1}.dot-louvor{background:#8b5cf6}
.dot-midia{background:#f59e0b}.dot-bistro{background:#10b981}.dot-ofertas{background:#ef4444}.dot-lideranca{background:#000}.dot-intercessao{background:#ec4899}.dot-organizacao{background:#0ea5a4}
.volsearch{position:relative}
.volsearch-input{width:100%;border:1px solid var(--g200);border-radius:var(--rs);padding:7px 9px;font-size:12px;font-family:inherit;background:#fff}
.volsearch-input:focus{outline:none;border-color:var(--g600)}
.volsearch-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--g200);border-radius:var(--rs);max-height:180px;overflow-y:auto;z-index:60;box-shadow:0 6px 16px rgba(0,0,0,.12);display:none;margin-top:2px}
.volsearch-item{padding:8px 10px;font-size:12px;cursor:pointer}
.volsearch-item:hover{background:var(--g50)}
.volsearch-clear{color:var(--g400);border-top:1px solid var(--g100)}
.oc-toggle{display:flex;gap:6px;margin-bottom:6px}
.oc-toggle .modo-btn{flex:1;padding:6px 8px;font-size:11px;border:1px solid var(--g200);background:#fff;border-radius:var(--rs);cursor:pointer;font-family:inherit;color:var(--g600)}
.oc-toggle .modo-btn.active{background:var(--black);color:#fff;border-color:var(--black)}
.escala-dept{margin-bottom:18px}
.escala-dept-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g600);padding:7px 0;border-bottom:1px solid var(--g200);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.escala-dept-locked{font-size:10px;color:var(--g400);font-weight:400;text-transform:none;letter-spacing:0}
.escala-slot{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--g100);flex-wrap:wrap}
.escala-slot:last-child{border-bottom:none}
.slot-func{font-size:12px;color:var(--g400);width:100%;margin-bottom:4px}
@media(min-width:400px){.slot-func{width:150px;margin-bottom:0}}
.slot-sel{flex:1;min-width:0}
.slot-sel select{width:100%;font-size:12px;padding:6px 8px;border:1px solid var(--g200);border-radius:var(--rs);background:#fff}
.slot-sel select:disabled{background:var(--g50);color:var(--g400)}
.slot-assigned{font-size:13px;color:var(--g800);flex:1}
.presenca-btn{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--g200);cursor:pointer;background:#fff}
.presenca-sim{background:#e6f4ea;color:#1a7a2e;border-color:#1a7a2e}
.presenca-nao{background:#fce8e8;color:#c00;border-color:#fcc}
.visitors-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:500px){.visitors-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}
.v-card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:14px}
.v-name{font-weight:600;font-size:14px;margin-bottom:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.v-detail{font-size:12px;color:var(--g400);margin-top:3px;display:flex;align-items:center;gap:5px}
.v-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.v-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--g200);flex-shrink:0}
.v-avatar-placeholder{width:48px;height:48px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.empty-state{text-align:center;padding:36px 16px;color:var(--g400);font-size:14px}
.empty-icon{font-size:32px;margin-bottom:10px}
.restricted-note{background:var(--g50);border-left:3px solid var(--black);padding:10px 12px;border-radius:0 var(--rs) var(--rs) 0;font-size:12px;color:var(--g600);margin-bottom:14px}
.tab-bar{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--g200);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{background:none;border:none;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--g400);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:inherit}
.tab.active{color:var(--black);border-bottom-color:var(--black);font-weight:500}
.user-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--g100);gap:8px;flex-wrap:wrap}
.user-row:last-child{border-bottom:none}
.u-name{font-size:14px;font-weight:500}
.u-email{font-size:12px;color:var(--g400);margin-top:1px}
.foto-upload-wrap{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.foto-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--g200)}
.foto-preview-placeholder{width:64px;height:64px;border-radius:50%;background:var(--g100);border:2px dashed var(--g200);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}
.aviso-card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:14px;margin-bottom:10px;border-left:3px solid var(--black)}
.aviso-titulo{font-weight:600;font-size:14px;margin-bottom:4px}
.aviso-msg{font-size:13px;color:var(--g600);line-height:1.5}
.aviso-meta{font-size:11px;color:var(--g400);margin-top:8px}
.decisao-card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:14px;margin-bottom:10px}
.decisao-nome{font-weight:600;font-size:14px}
.decisao-tipo{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:6px}
.tipo-salvo{background:#e6f4ea;color:#1a7a2e}
.tipo-batismo{background:#e8f0fe;color:#1a56db}
.tipo-reconciliado{background:#fef3cd;color:#856404}
.semana-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.semana-box{flex:1;min-width:80px;border:1px solid var(--g200);border-radius:var(--rs);padding:6px 8px;font-size:11px}
.semana-label{font-weight:600;color:var(--g600);margin-bottom:2px}
.semana-status{font-size:10px}
.membro-card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.membro-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--g200);flex-shrink:0}
.membro-avatar-ph{width:48px;height:48px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.membro-info{flex:1}
.membro-nome{font-weight:600;font-size:14px}
.membro-detalhe{font-size:12px;color:var(--g400);margin-top:2px}
.membro-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:1fr;gap:8px}
.cal-evento{background:#fff;border:1px solid var(--g200);border-radius:var(--rs);padding:12px;border-left:4px solid var(--black);display:flex;gap:12px;align-items:flex-start}
.cal-data{min-width:50px;text-align:center;font-size:11px;color:var(--g400)}
.cal-dia{font-size:22px;font-weight:700;color:var(--g800);line-height:1}
.cal-info{flex:1}
.cal-titulo{font-weight:600;font-size:13px}
.cal-detalhe{font-size:11px;color:var(--g400);margin-top:2px}
.aniv-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--g100)}
.aniv-item:last-child{border-bottom:none}
.aniv-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--g200)}
.aniv-avatar-ph{width:36px;height:36px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:14px}
.aniv-info{flex:1}
.aniv-nome{font-size:13px;font-weight:500}
.aniv-data{font-size:11px;color:var(--g400)}
.filtro-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filtro-bar select,.filtro-bar input{font-size:13px;padding:7px 10px;border:1px solid var(--g200);border-radius:var(--rs);background:#fff;font-family:inherit}
</style>
</head>

function normalizeNome(s){return(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function normalizeTel(s){return(s||'').replace(/\D/g,'');}
async function existeDuplicado(tabela,nome,telefone,excludeId){
  const telNorm=normalizeTel(telefone);
  if(!nome||!telNorm)return false;
  const nomeNorm=normalizeNome(nome);
  let query=db.from(tabela).select('id,nome,telefone');
  if(tabela==='membros')query=query.eq('status','ativo');
  const{data}=await query;
  return(data||[]).some(r=>r.id!==excludeId&&normalizeNome(r.nome)===nomeNorm&&normalizeTel(r.telefone)===telNorm);
}

  const p=val.split('-');
  document.getElementById(prefix+'-y').value=p[0]||'';
  document.getElementById(prefix+'-m').value=p[1]||'';
  document.getElementById(prefix+'-d').value=p[2]||'';
}
function fieldsToDate(prefix){
  const y=(document.getElementById(prefix+'-y')?.value||'').trim();
  const m=(document.getElementById(prefix+'-m')?.value||'').trim();
  const d=(document.getElementById(prefix+'-d')?.value||'').trim();
  if(!y||!m||!d)return'';
  return`${y.padStart(4,'0')}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}

// ── ESCALAS (com múltiplos slots e presença)
function cultoMaisProximoId(){
  if(!allCultos.length)return null;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  let melhor=allCultos[0],menorDiff=Infinity;
  allCultos.forEach(c=>{
    const dc=new Date(c.data+'T12:00:00');dc.setHours(0,0,0,0);
    const diff=Math.abs(dc-hoje);
    if(diff<menorDiff){menorDiff=diff;melhor=c;}
  });
  return melhor.id;
}
async function renderEscalas(){
  await loadData();
  if(!allCultos.length){document.getElementById('content').innerHTML=`<div class="card"><div class="empty-state"><div class="empty-icon">📋</div>Cadastre um culto primeiro.</div></div>`;return;}
  const cidProximo=cultoMaisProximoId();
  const opts=allCultos.map(c=>`<option value="${c.id}"${c.id===cidProximo?' selected':''}>${fmtDateShort(c.data)}${c.tema?' — '+c.tema:''}</option>`).join('');
  document.getElementById('content').innerHTML=`
    <div class="card"><div class="card-title">Culto</div><div class="f"><select id="esc-sel" onchange="loadEscala()">${opts}</select></div></div>
    <div id="esc-body"></div>`;
  loadEscala();
}

const FUNCS_UNIFICADAS_ORDEM={lideranca:['Pregador','Mestre de cerimônias','Abertura e boas-vindas']};
function isFuncUnificada(dept,func){return(FUNCS_UNIFICADAS_ORDEM[dept]||[]).includes(func);}

async function loadEscala(){
  const cid=document.getElementById('esc-sel').value;
  const{data:esc}=await db.from('escalas').select('*,voluntarios(nome,foto_url,telefone)').eq('culto_id',cid);
  const ec=esc||[];
  const culto=allCultos.find(c=>c.id===cid);
  const myDepts=ROLE_DEPTS[currentRole];
  let html=`<div class="card"><div class="card-title">Escala do culto</div>`;
  DEPTS.forEach(d=>{
    const canEdit=!myDepts||myDepts.includes(d.key);
    html+=`<div class="escala-dept"><div class="escala-dept-title"><span><span class="dot ${d.dot}"></span>${d.label}</span>${!canEdit?'<span class="escala-dept-locked">preenchido pela equipe</span>':''}</div>`;
    d.funcs.forEach(f=>{
      const numSlots=d.slots?(d.slots[f]||d.slots.default||1):1;
      const qtd=d.slots&&d.slots[f]?d.slots[f]:d.slots?.default||1;
      for(let s=1;s<=qtd;s++){
        const slot=ec.find(e=>e.departamento===d.key&&e.funcao===f&&e.slot_numero===s);
        const nomeAtribuido=slot?.voluntarios?.nome||slot?.convidado_nome||'';
        const lembreteBtn=(slot?.voluntario_id&&slot?.voluntarios?.telefone&&culto?.data)?`<button class="btn btn-wpp btn-sm" style="margin-left:6px" onclick="enviarLembreteEscala('${slot.voluntarios.telefone}','${(slot.voluntarios.nome||'').replace(/'/g,"\\'")}','${culto.data}','${(culto.tema||'').replace(/'/g,"\\'")}','${d.key}','${f.replace(/'/g,"\\'")}')">📅 Lembrete</button>`:'';
        html+=`<div class="escala-slot"><span class="slot-func">${f}${qtd>1?` #${s}`:''}</span><div class="slot-sel">`;
        if(canEdit){
          html+=volSearchFieldHtml(cid,d.key,f,s,slot,isFuncUnificada(d.key,f));
          if(slot?.voluntario_id){
            const pClass=slot.compareceu===true?'presenca-sim':slot.compareceu===false?'presenca-nao':'';
            const pLabel=slot.compareceu===true?'✓ Presente':slot.compareceu===false?'✗ Faltou':'Presença?';
            html+=`<button class="presenca-btn ${pClass}" style="margin-left:6px" onclick="togglePresenca('${slot.id}',${slot.compareceu})">${pLabel}</button>`;
          }
          html+=lembreteBtn;
        }else{
          html+=`<span class="slot-assigned">${nomeAtribuido||'<span style="color:var(--g400)">—</span>'}</span>`;
          html+=lembreteBtn;
        }
        html+=`</div></div>`;
      }
    });
    html+=`</div>`;
  });
  html+=`<button class="btn btn-secondary btn-sm" onclick="exportEscala('${cid}')">📤 Exportar TXT</button></div>`;
  document.getElementById('esc-body').innerHTML=html;
}

// ── Componente de busca de voluntário (usado em Escalas e Ordem do Culto)
function volSearchFieldHtml(cid,dept,func,slot,slotData,unificada){
  const isConvidado=!!slotData?.convidado_nome;
  const volNome=slotData?.voluntarios?.nome||'';
  const convNome=slotData?.convidado_nome||'';
  const searchBox=`<div class="volsearch" data-cid="${cid}" data-dept="${dept}" data-func="${func}" data-slot="${slot}">
    <input type="text" class="volsearch-input" value="${volNome}" placeholder="🔎 Buscar voluntário..." autocomplete="off" oninput="volSearchFilter(this)" onfocus="volSearchFilter(this)" onblur="volSearchBlur(this)">
    <div class="volsearch-list"></div>
  </div>`;
  if(!unificada)return `<div style="flex:1;min-width:0">${searchBox}</div>`;
  const convidadoBox=`<input type="text" value="${convNome}" placeholder="Nome do convidado" onchange="saveSlotConvidado('${cid}','${dept}','${func}',${slot},this.value)">`;
  return`<div class="func-modo-wrap" style="flex:1;min-width:0">
    <div class="oc-toggle">
      <button type="button" class="modo-btn ${!isConvidado?'active':''}" data-modo="cad" onclick="funcModoSwitch(this)">Cadastrado</button>
      <button type="button" class="modo-btn ${isConvidado?'active':''}" data-modo="conv" onclick="funcModoSwitch(this)">Convidado</button>
    </div>
    <div class="modo-pane" data-modo="cad" style="display:${!isConvidado?'block':'none'}">${searchBox}</div>
    <div class="modo-pane" data-modo="conv" style="display:${isConvidado?'block':'none'}">${convidadoBox}</div>
  </div>`;
}
function funcModoSwitch(btn){
  const wrap=btn.closest('.func-modo-wrap');
  wrap.querySelectorAll('.modo-btn').forEach(b=>b.classList.toggle('active',b===btn));
  const modo=btn.dataset.modo;
  wrap.querySelectorAll('.modo-pane').forEach(p=>{p.style.display=(p.dataset.modo===modo)?'block':'none';});
}
function volSearchFilter(inputEl){
  const wrap=inputEl.closest('.volsearch');
  const list=wrap.querySelector('.volsearch-list');
  const q=inputEl.value.trim().toLowerCase();
  const matches=(q?allVols.filter(v=>(v.nome||'').toLowerCase().includes(q)):allVols).slice(0,8);
  list.innerHTML=matches.map(v=>`<div class="volsearch-item" onmousedown="volSearchPick(this,'${v.id}','${(v.nome||'').replace(/'/g,"\\'")}')">${v.nome}</div>`).join('')
    +`<div class="volsearch-item volsearch-clear" onmousedown="volSearchPick(this,'','')">— Remover —</div>`;
  list.style.display='block';
}
function volSearchBlur(inputEl){
  setTimeout(()=>{const wrap=inputEl.closest('.volsearch');if(wrap){const list=wrap.querySelector('.volsearch-list');if(list)list.style.display='none';}},150);
}
function volSearchPick(itemEl,volId,nome){
  const wrap=itemEl.closest('.volsearch');
  const input=wrap.querySelector('.volsearch-input');
  input.value=volId?nome:'';
  wrap.querySelector('.volsearch-list').style.display='none';
  saveSlot(wrap.dataset.cid,wrap.dataset.dept,wrap.dataset.func,parseInt(wrap.dataset.slot),volId);
}

async function saveSlot(cid,dept,func,slot,vid){
  await db.from('escalas').delete().match({culto_id:cid,departamento:dept,funcao:func,slot_numero:slot});
  if(vid){await db.from('escalas').insert({culto_id:cid,voluntario_id:vid,departamento:dept,funcao:func,slot_numero:slot});toast('Salvo!');}
  if(document.getElementById('esc-body'))loadEscala();
  if(document.getElementById('oc-body'))loadOrdem();
}
async function saveSlotConvidado(cid,dept,func,slot,nome){
  await db.from('escalas').delete().match({culto_id:cid,departamento:dept,funcao:func,slot_numero:slot});
  if(nome&&nome.trim()){await db.from('escalas').insert({culto_id:cid,departamento:dept,funcao:func,slot_numero:slot,convidado_nome:nome.trim()});toast('Salvo!');}
  if(document.getElementById('esc-body'))loadEscala();
  if(document.getElementById('oc-body'))loadOrdem();
}

async function togglePresenca(id,atual){
  let novo=atual===true?false:atual===false?null:true;
  await db.from('escalas').update({compareceu:novo}).eq('id',id);
  toast(novo===true?'Marcado como presente':novo===false?'Marcado como faltou':'Presença removida');
  loadEscala();
}

async function exportEscala(cid){
  const culto=allCultos.find(c=>c.id===cid);
  const{data:esc}=await db.from('escalas').select('*,voluntarios(nome)').eq('culto_id',cid);
  const dt=culto?new Date(culto.data+'T12:00:00').toLocaleDateString('pt-BR'):'';
  let txt=`ESCALA MIP CHURCH — ${dt}\n${culto?.tema||''}\n\n`;
  DEPTS.forEach(d=>{const slots=(esc||[]).filter(e=>e.departamento===d.key);if(slots.length){txt+=`${d.label.toUpperCase()}\n`;slots.forEach(s=>{txt+=`  ${s.funcao}${s.slot_numero>1?` #${s.slot_numero}`:''}: ${s.voluntarios?.nome||s.convidado_nome||'—'}${s.convidado_nome?' (convidado)':''}\n`;});txt+='\n';}});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=`escala_${dt.replace(/\//g,'-')}.txt`;a.click();
  toast('Exportado!');
}

async function renderCalendario(){

  const tipoLabel={culto:'Culto',retiro:'Retiro',vigilia:'Vigília',reuniao:'Reunião',evento:'Evento',outro:'Outro'};

  if(!eventos.length){html+=`<div class="card"><div class="empty-state"><div class="empty-icon">🗓</div>Nenhum evento cadastrado.</div></div>`;
  }else{
    html+=`<div class="cal-grid">`;
    eventos.forEach(e=>{
      const d=new Date(e.data_inicio);
      const cor=tipoCor[e.tipo]||'#000';
      html+=`<div class="cal-evento" style="border-left-color:${cor}">
        <div class="cal-data"><div class="cal-dia">${d.getDate()}</div>${d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}<br>${d.getFullYear()}</div>

          ${e.responsavel?`<div class="cal-detalhe">👤 ${e.responsavel}</div>`:''}
          ${e.descricao?`<div class="cal-detalhe" style="margin-top:4px">${e.descricao}</div>`:''}
          ${CAN_MEMBROS.includes(currentRole)?`<div style="margin-top:8px"><button class="btn btn-secondary btn-sm" onclick="editEvento('${e.id}')">Editar</button> <button class="btn btn-danger btn-sm" onclick="deleteEvento('${e.id}')">Excluir</button></div>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('content').innerHTML=html;
}

async function editEvento(id){

async function saveEvento(){

async function updateEvento(id){
  await db.from('eventos').update({titulo:gv('ev-titulo'),tipo:gv('ev-tipo'),data_inicio:document.getElementById('ev-data').value,local:gv('ev-local'),responsavel:gv('ev-resp'),descricao:gv('ev-desc')}).eq('id',id);

}
async function deleteEvento(id){

}

async function saveRelatorio(){
  const cid=gv('rel-culto');const role=currentRole;
  const g=id=>(document.getElementById(id)||{}).value;
  const saves=[];
  if(['recepcao','lideranca','coordenador','admin'].includes(role))saves.push(db.from('relatorios').insert({culto_id:cid,tipo:'recepcao',dados:{presentes:parseInt(g('rel-pres'))||0,membros:parseInt(g('rel-memb'))||0,data:allCultos.find(c=>c.id===cid)?.data}}));
  if(['bistro','coordenador','admin'].includes(role))saves.push(db.from('relatorios').insert({culto_id:cid,tipo:'bistro',dados:{totalBistro:parseFloat(g('rel-bistro'))||0,obs:g('rel-bistro-obs')}}));
  if(['financeiro','admin'].includes(role)){const e=parseFloat(g('rel-esp'))||0,p=parseFloat(g('rel-pix'))||0,o=parseFloat(g('rel-out'))||0;saves.push(db.from('relatorios').insert({culto_id:cid,tipo:'financeiro',dados:{especie:e,pix:p,outras:o,outrasDesc:g('rel-out-desc'),totalOferta:e+p+o}}));}
  if(['lideranca','coordenador','admin'].includes(role))saves.push(db.from('relatorios').insert({culto_id:cid,tipo:'lideranca',dados:{salvos:parseInt(g('rel-salv'))||0,reconciliados:parseInt(g('rel-rec'))||0,batismo:parseInt(g('rel-bat'))||0,whatsapp:parseInt(g('rel-wpp'))||0,nota:g('rel-nota'),positivos:g('rel-pos'),melhorar:g('rel-mel')}}));
  if(['midia'].includes(role))saves.push(db.from('relatorios').insert({culto_id:cid,tipo:'midia',dados:{problemas:g('rel-mid-p'),obs:g('rel-mid-o')}}));
  await Promise.all(saves);
  toast('Relatório salvo!');navigate('dashboard');
}

function previewFoto(inputId,previewId){
  const file=document.getElementById(inputId)?.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const el=document.getElementById(previewId);
    if(el.tagName==='IMG'){el.src=e.target.result;}
    else{el.outerHTML=`<img src="${e.target.result}" class="foto-preview" id="${previewId}">`;};
  };
  reader.readAsDataURL(file);
}
function previewFotoFrom(sourceInputId,previewId,targetInputId){
  const file=document.getElementById(sourceInputId)?.files[0];
  if(!file)return;
  // Transfer file to main input via DataTransfer
  try{const dt=new DataTransfer();dt.items.add(file);const ti=document.getElementById(targetInputId);if(ti)ti.files=dt.files;}catch(e){}
  const reader=new FileReader();
  reader.onload=e=>{
    const el=document.getElementById(previewId);
    if(el.tagName==='IMG'){el.src=e.target.result;}
    else{el.outerHTML=`<img src="${e.target.result}" class="foto-preview" id="${previewId}">`;};
  };
  reader.readAsDataURL(file);
}

async function loadOrdem(){
  const cid=document.getElementById('oc-culto-sel')?.value;
  if(!cid)return;
  const[existingRes,escLidRes]=await Promise.all([
    db.from('relatorios').select('dados').eq('culto_id',cid).eq('tipo','ordem_culto').single(),
    db.from('escalas').select('*,voluntarios(nome)').eq('culto_id',cid).eq('departamento','lideranca'),
  ]);
  const saved=existingRes.data?.dados||{};
  const escLid=escLidRes.data||[];
  let html=`<div class="card"><div class="card-title">Momentos do Culto</div>`;
  ORDEM_MOMENTOS.forEach(m=>{
    const d=saved[m.key]||{};
    const slotLid=m.escalaFunc?escLid.find(e=>e.funcao===m.escalaFunc&&e.slot_numero===1):null;
    html+=`<div style="padding:14px 0;border-bottom:1px solid var(--g100)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:18px">${m.icon}</span>

          <div style="font-size:11px;color:var(--g400)">${m.dur}</div>
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
          <input type="checkbox" id="oc-ok-${m.key}" ${d.realizado?'checked':''}> Realizado
        </label>
      </div>
      ${m.escalaFunc?`
        <div class="form-row" style="margin-bottom:8px;align-items:flex-start">
          <div class="f"><label>${m.temPregador?'Pregador':'Responsável'} <span style="font-weight:400;color:var(--g400)">(sincronizado com a Escala)</span></label>${volSearchFieldHtml(cid,'lideranca',m.escalaFunc,1,slotLid,true)}</div>
          ${m.temPregador?`<div class="f"><label>Tema / Série</label><input type="text" id="oc-tema-${m.key}" value="${d.tema||''}" placeholder="Tema da mensagem"></div>`:''}
        </div>
      `:`<div class="f" style="margin-bottom:8px"><label>Responsável</label><input type="text" id="oc-resp-${m.key}" value="${d.responsavel||''}" placeholder="${m.desc}"></div>`}
      <div class="f"><label>Observações</label><textarea id="oc-obs-${m.key}" style="min-height:50px" placeholder="Observações...">${d.observacoes||''}</textarea></div>

async function saveOrdem(){
  const cid=document.getElementById('oc-culto-sel')?.value;
  if(!cid)return;
  const dados={};
  ORDEM_MOMENTOS.forEach(m=>{
    dados[m.key]={
      realizado:document.getElementById(`oc-ok-${m.key}`)?.checked||false,
      observacoes:document.getElementById(`oc-obs-${m.key}`)?.value||'',
    };
    if(m.temPregador){
      dados[m.key].tema=document.getElementById(`oc-tema-${m.key}`)?.value||'';
    }
    if(!m.escalaFunc){
      dados[m.key].responsavel=document.getElementById(`oc-resp-${m.key}`)?.value||'';
    }
  });
  const{data:existing}=await db.from('relatorios').select('id').eq('culto_id',cid).eq('tipo','ordem_culto').single();
  if(existing?.id){
    await db.from('relatorios').update({dados}).eq('id',existing.id);
  }else{
    await db.from('relatorios').insert({culto_id:cid,tipo:'ordem_culto',dados});
  }
  toast('Ordem do Culto salva!');
}

  </div>`;

  // Ordem do Culto

    html+=`<div style="font-size:13px;color:var(--g400);padding:8px 0">Ordem do culto não preenchida.</div>`;
  }else{
    ORDEM_MOMENTOS.forEach(m=>{
      const d=ordem[m.key]||{};
      const realizado=d.realizado;
      let nomeResp='';
      if(m.escalaFunc){
        const s=esc.find(e=>e.departamento==='lideranca'&&e.funcao===m.escalaFunc&&e.slot_numero===1);
        nomeResp=s?.voluntarios?.nome||s?.convidado_nome||'';
      }else{
        nomeResp=d.responsavel||'';
      }
      html+=`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--g100)">
        <span style="font-size:16px;margin-top:2px">${m.icon}</span>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:600">${m.label}</span>
            <span style="font-size:10px;color:var(--g400)">${m.dur}</span>
            ${realizado?`<span class="badge badge-green">✓ Realizado</span>`:`<span class="badge badge-gray">Pendente</span>`}
          </div>
          ${nomeResp?`<div style="font-size:12px;color:var(--g600);margin-top:3px">👤 ${nomeResp}${m.temPregador&&d.tema?' — '+d.tema:''}</div>`:''}
          ${d.observacoes?`<div style="font-size:11px;color:var(--g400);margin-top:3px;font-style:italic">${d.observacoes}</div>`:''}
        </div>
      </div>`;
    });
  }
  html+=`</div>`;

  // Escalas por departamento
  html+=`<div class="card"><div class="card-title">📋 Escala Completa</div>`;
  if(!esc.length){
    html+=`<div style="font-size:13px;color:var(--g400);padding:8px 0">Escala não preenchida.</div>`;
  }else{
    DEPTS.forEach(d=>{
      const slots=esc.filter(e=>e.departamento===d.key);
      if(!slots.length)return;
      html+=`<div style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g600);padding:6px 0;border-bottom:1px solid var(--g200);margin-bottom:8px;display:flex;align-items:center;gap:6px">
          <span class="dot ${d.dot}"></span>${d.label}
        </div>`;
      slots.forEach(s=>{
        const nome=s.voluntarios?.nome||'—';
        const url=fotoUrl(s.voluntarios?.foto_url);
        const presClass=s.compareceu===true?'badge-green':s.compareceu===false?'badge-red':'badge-gray';
        const presLabel=s.compareceu===true?'✓ Presente':s.compareceu===false?'✗ Faltou':'—';
        html+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--g100)">
          ${url?`<img src="${url}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0">`:`<div style="width:28px;height:28px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0">👤</div>`}
          <div style="flex:1">
            <div style="font-size:13px;font-weight:500">${nome}</div>
            <div style="font-size:11px;color:var(--g400)">${s.funcao}${s.slot_numero>1?' #'+s.slot_numero:''}</div>
          </div>
          <span class="badge ${presClass}" style="font-size:10px">${presLabel}</span>
        </div>`;
      });
      html+=`</div>`;
    });
  }
  html+=`</div>`;
  document.getElementById('dc-body').innerHTML=html;
}

// ── VOLUNTÁRIOS
function parseDepts(v){
  try{const d=v.departamento;if(!d)return[];if(d.startsWith('['))return JSON.parse(d);return[d];}catch(e){return v.departamento?[v.departamento]:[];}
}
function parseFuncs(v){
  try{const f=v.funcao;if(!f)return[];if(f.startsWith('['))return JSON.parse(f);return[f];}catch(e){return v.funcao?[v.funcao]:[];}
}
function getDeptLabels(v){
  const depts=parseDepts(v);
  return depts.map(dk=>{const d=DEPTS.find(x=>x.key===dk);return d?d.label:dk;}).join(', ')||'—';
}

// ── ESCALAS DO VOLUNTÁRIO (contador do mês + lembrete)
let escalasPorVol={};
async function loadEscalasPorVol(){
  const{data}=await db.from('escalas').select('*,cultos(data,tema)').order('id');
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const mesAtual=new Date().getMonth(),anoAtual=new Date().getFullYear();
  escalasPorVol={};
  (data||[]).forEach(e=>{
    if(!e.voluntario_id||!e.cultos?.data)return;
    if(!escalasPorVol[e.voluntario_id])escalasPorVol[e.voluntario_id]={mes:[],futuras:[]};
    const dCulto=new Date(e.cultos.data+'T12:00:00');
    const item={data:e.cultos.data,tema:e.cultos.tema,departamento:e.departamento,funcao:e.funcao};
    if(dCulto.getMonth()===mesAtual&&dCulto.getFullYear()===anoAtual)escalasPorVol[e.voluntario_id].mes.push(item);
    if(dCulto>=hoje)escalasPorVol[e.voluntario_id].futuras.push(item);
  });
  Object.values(escalasPorVol).forEach(o=>o.futuras.sort((a,b)=>a.data.localeCompare(b.data)));
}
function verEscalasMesVol(vid,nome){
  const lista=(escalasPorVol[vid]?.mes)||[];
  let html=lista.length?`<div style="display:flex;flex-direction:column;gap:8px">`+lista.map(i=>{
    const d=DEPTS.find(x=>x.key===i.departamento);
    return`<div style="padding:8px 10px;border:1px solid var(--g200);border-radius:var(--rs);font-size:13px"><strong>${fmtDate(i.data)}</strong>${i.tema?' — '+i.tema:''}<br><span style="color:var(--g600)">${i.funcao||''}${d?' ('+d.label+')':''}</span></div>`;
  }).join('')+`</div>`:`<div class="empty-state"><div class="empty-icon">📋</div>Nenhuma escala este mês.</div>`;
  document.getElementById('modal-title').textContent=`Escalas de ${nome} este mês`;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal').classList.remove('hidden');
}
function msgLembreteEscala(nome,dataCulto,tema,deptKey,funcao){
  const primeiro=(nome||'').split(' ')[0];
  const d=DEPTS.find(x=>x.key===deptKey);
  const remetente=(currentProfile?.nome||'').split(' ')[0]||'Liderança MIP Church';
  return`Oi, ${primeiro}! Tudo bem? 🙏\n\nPassando com carinho pra lembrar que você está na escala do nosso culto do dia ${fmtDate(dataCulto)}${tema?' — '+tema:''}, servindo em ${funcao||'—'}${d?' ('+d.label+')':''}.\n\nSaber que você vai estar lá já alegra o nosso coração — sua entrega faz toda diferença pro que Deus está fazendo no MIP Church. Qualquer coisa, é só me chamar!\n\nUm abraço,\n${remetente}`;
}
function enviarLembreteEscala(tel,nome,dataCulto,tema,deptKey,funcao){
  const link=wppLink(tel,msgLembreteEscala(nome,dataCulto,tema,deptKey,funcao));
  if(!link){toast('Este voluntário não tem telefone cadastrado.');return;}
  window.open(link,'_blank');closeModal();
}
function abrirMenuContatoVoluntario(vid,nome,tel){
  if(!tel){toast('Este voluntário não tem telefone cadastrado.');return;}
  const proxima=(escalasPorVol[vid]?.futuras)||[];
  const prox=proxima[0];
  let html=`<div style="display:flex;flex-direction:column;gap:8px">`;
  if(prox){
    html+=`<button class="btn btn-wpp btn-full" onclick="enviarLembreteEscala('${tel}','${nome.replace(/'/g,"\\'")}','${prox.data}','${(prox.tema||'').replace(/'/g,"\\'")}','${prox.departamento||''}','${(prox.funcao||'').replace(/'/g,"\\'")}')">📅 Lembrete: ${fmtDateShort(prox.data)}${prox.tema?' — '+prox.tema:''}</button>`;
  }else{
    html+=`<div style="font-size:13px;color:var(--g600);padding:6px 0">Sem escala futura agendada.</div>`;
  }
  const linkLivre=wppLink(tel);
  html+=`<a href="${linkLivre}" target="_blank" class="btn btn-secondary btn-full" style="text-decoration:none;text-align:center" onclick="closeModal()">💬 Mensagem livre</a>`;
  html+=`</div>`;
  document.getElementById('modal-title').textContent='Enviar mensagem para '+nome.split(' ')[0];
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal').classList.remove('hidden');
}

async function renderVoluntarios(){
  await loadData();
  await loadEscalasPorVol();
  // Group by first dept for display, also show multi-dept volunteers in each
  const byD={};DEPTS.forEach(d=>{byD[d.key]=[];});
  const semD=[];
  allVols.forEach(v=>{
    const depts=parseDepts(v);
    if(!depts.length){semD.push(v);return;}
    depts.forEach(dk=>{if(byD[dk])byD[dk].push(v);});
  });
  // deduplicate display: show each vol only in their FIRST dept listed
  const shown=new Set();
  let html=`<div class="sec-actions"><h2>Voluntários</h2><button class="btn btn-primary btn-sm" onclick="openModalVol()">+ Novo</button></div>
  <div class="metric-grid"><div class="metric"><div class="metric-label">Total ativo</div><div class="metric-value">${allVols.length}</div></div>`;
  DEPTS.forEach(d=>{const cnt=allVols.filter(v=>parseDepts(v).includes(d.key)).length;if(cnt)html+=`<div class="metric"><div class="metric-label">${d.label}</div><div class="metric-value">${cnt}</div></div>`;});
  html+=`</div>`;
  const escalaBadge=v=>{
    const n=(escalasPorVol[v.id]?.mes||[]).length;
    return n?`<span class="badge badge-green" style="cursor:pointer" onclick="verEscalasMesVol('${v.id}','${(v.nome||'').replace(/'/g,"\\'")}')">${n} escala${n>1?'s':''} este mês</span>`:`<span class="badge badge-gray">Sem escala este mês</span>`;
  };
  const volCard=v=>{
    const url=fotoUrl(v.foto_url);
    const dLabels=getDeptLabels(v);
    const fLabels=parseFuncs(v).join(', ')||'—';
    return`<div class="membro-card">
      ${url?`<img src="${url}" class="membro-avatar">`:`<div class="membro-avatar-ph">👤</div>`}
      <div class="membro-info">
        <div class="membro-nome">${v.nome}</div>
        <div class="membro-detalhe">${dLabels}${fLabels!=='—'?' · '+fLabels:''}</div>
        <div class="membro-detalhe" style="margin-top:6px">${escalaBadge(v)}</div>
        <div class="membro-actions">
          ${v.telefone?`<button class="btn btn-wpp btn-sm" onclick="abrirMenuContatoVoluntario('${v.id}','${(v.nome||'').replace(/'/g,"\\'")}','${v.telefone}')">💬 WhatsApp</button>`:''}
          <button class="btn btn-secondary btn-sm" onclick="editVol('${v.id}')">Editar</button>
        </div>
      </div>
    </div>`;
  };
  DEPTS.forEach(d=>{
    const vs=allVols.filter(v=>parseDepts(v).includes(d.key)&&!shown.has(v.id));
    vs.forEach(v=>shown.add(v.id));
    if(!vs.length)return;
    html+=`<div class="card-title" style="margin:16px 0 8px"><span class="dot ${d.dot}"></span>${d.label}</div>`;
    vs.forEach(v=>{html+=volCard(v);});
  });
  if(semD.length){
    html+=`<div class="card-title" style="margin:16px 0 8px">Sem departamento</div>`;
    semD.forEach(v=>{html+=volCard(v);});
  }
  if(!allVols.length)html+=`<div class="card"><div class="empty-state"><div class="empty-icon">🙋</div>Nenhum voluntário cadastrado.</div></div>`;
  document.getElementById('content').innerHTML=html;
}

    </div>
    <div class="form-row"><div class="f"><label>Nome</label><input type="text" id="vf-nome" value="${v.nome||''}" placeholder="Nome completo"></div><div class="f"><label>Telefone / WhatsApp</label><input type="tel" id="vf-tel" value="${v.telefone||''}" placeholder="(xx) xxxxx-xxxx"></div></div>

function toggleVfFuncs(dkey){
  const chk=document.querySelector(`.vf-dept-chk[value="${dkey}"]`);
  const el=document.getElementById(`vf-funcs-${dkey}`);
  if(el)el.style.display=chk?.checked?'block':'none';
  if(!chk?.checked)document.querySelectorAll(`.vf-func-chk-${dkey}`).forEach(c=>c.checked=false);
}
function getVolDeptsFuncs(){
  const depts=[],funcs=[];
  document.querySelectorAll('.vf-dept-chk:checked').forEach(c=>{
    depts.push(c.value);
    document.querySelectorAll(`.vf-func-chk-${c.value}:checked`).forEach(f=>funcs.push(f.value));
  });
  return{
    departamento:depts.length?JSON.stringify(depts):null,
    funcao:funcs.length?JSON.stringify(funcs):null,
  };
}
function updateFuncs(prefix='vf'){const d=document.getElementById(`${prefix}-dept`)?.value||'';const fs=DEPTS.find(x=>x.key===d)?.funcs||[];const el=document.getElementById(`${prefix}-func`);if(el)el.innerHTML='<option value="">—</option>'+fs.map(f=>'<option>'+f+'</option>').join('');}
function openModalVol(){document.getElementById('modal-title').textContent='Novo Voluntário';document.getElementById('modal-body').innerHTML=volFormHtml()+`<button class="btn btn-primary btn-full" style="margin-top:10px" onclick="saveVol()">Salvar</button>`;document.getElementById('modal').classList.remove('hidden');}
async function editVol(id){const v=allVols.find(x=>x.id===id);document.getElementById('modal-title').textContent='Editar Voluntário';document.getElementById('modal-body').innerHTML=volFormHtml(v)+`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary" style="flex:1" onclick="updateVol('${id}')">Salvar</button><button class="btn btn-danger" onclick="deleteVol('${id}')">Remover</button></div>`;document.getElementById('modal').classList.remove('hidden');}

async function updateVol(id){
  let foto_url=undefined;
  const fi=document.getElementById('vf-foto-input');
  if(fi?.files[0])foto_url=await uploadFoto(fi.files[0],'voluntarios');

  await db.from('voluntarios').update(upd).eq('id',id);
  toast('Atualizado!');closeModal();await loadData();renderVoluntarios();

async function deleteVol(id){if(!confirm('Remover?'))return;await db.from('voluntarios').update({ativo:false}).eq('id',id);toast('Removido.');closeModal();await loadData();renderVoluntarios();}

const GPS_CATS={amigo:'Amigo',etiope:'Etíope',felipe:'Felipe'};
const GPS_CAT_BADGE={amigo:'badge-gray',etiope:'badge-blue',felipe:'badge-green'};
function gpsFaseAtual(semana){return GPS_FASES.find(f=>semana>=f.min&&semana<=f.max)||GPS_FASES[0];}
window._gpsGrupoAtual=null;

async function renderGPS(){
  if(!CAN_MEMBROS.includes(currentRole)){document.getElementById('content').innerHTML=`<div class="card"><div class="empty-state"><div class="empty-icon">🔒</div>Acesso não permitido.</div></div>`;return;}
  const{data}=await db.from('gps_grupos').select('*').eq('ativo',true).order('nome');
  const grupos=data||[];
  const volNome=id=>allVols.find(v=>v.id===id)?.nome||'—';
  let html=`<div class="sec-actions"><h2>GPS Precursores</h2><button class="btn btn-primary btn-sm" onclick="openModalGpsGrupo()">+ Novo Grupo</button></div>
  <div class="metric-grid">
    <div class="metric"><div class="metric-label">Grupos ativos</div><div class="metric-value">${grupos.length}</div></div>
  </div>`;
  if(!grupos.length){html+=`<div class="card"><div class="empty-state"><div class="empty-icon">🌍</div>Nenhum grupo GPS cadastrado ainda.</div></div>`;}
  else{
    grupos.forEach(g=>{
      const fase=gpsFaseAtual(g.semana_atual||1);
      html+=`<div class="membro-card" style="align-items:center">
        <div class="membro-avatar-ph">🌍</div>
        <div class="membro-info">
          <div class="membro-nome">${g.nome}</div>
          <div class="membro-detalhe">👤 Líder: ${volNome(g.lider_id)}</div>
          ${g.dia_semana||g.horario?`<div class="membro-detalhe">🗓 ${g.dia_semana||''} ${g.horario||''}</div>`:''}
          <div class="membro-detalhe">📍 Semana ${g.semana_atual||1}/16 · ${fase.nome}</div>
          <div class="membro-actions">
            <button class="btn btn-secondary btn-sm" onclick="abrirGpsGrupo('${g.id}')">Abrir</button>
            <button class="btn btn-secondary btn-sm" onclick="editGpsGrupo('${g.id}')">Editar</button>
          </div>
        </div>
      </div>`;
    });
  }
  document.getElementById('content').innerHTML=html;
}

function gpsGrupoFormHtml(g={}){
  const vOpts=(sel)=>`<option value="">— Selecionar —</option>`+allVols.map(v=>`<option value="${v.id}"${sel===v.id?' selected':''}>${v.nome}</option>`).join('');
  return`
    <div class="f"><label>Nome do grupo</label><input type="text" id="gg-nome" value="${g.nome||''}" placeholder="Ex: GPS Zona Sul"></div>
    <div class="form-row">
      <div class="f"><label>Líder</label><select id="gg-lider">${vOpts(g.lider_id)}</select></div>
      <div class="f"><label>Anfitrião</label><select id="gg-anfitriao">${vOpts(g.anfitriao_id)}</select></div>
    </div>
    <div class="f"><label>Professor de Crianças</label><select id="gg-prof">${vOpts(g.professor_criancas_id)}</select></div>
    <div class="form-row">
      <div class="f"><label>Dia da semana</label><input type="text" id="gg-dia" value="${g.dia_semana||''}" placeholder="Ex: Quarta-feira"></div>
      <div class="f"><label>Horário</label><input type="text" id="gg-hora" value="${g.horario||''}" placeholder="Ex: 20h"></div>
    </div>
    <div class="f"><label>Endereço</label><input type="text" id="gg-end" value="${g.endereco||''}" placeholder="Onde o grupo se reúne"></div>
    <div class="form-row">
      <div class="f"><label>Início do ciclo</label><input type="date" id="gg-inicio" value="${g.data_inicio_ciclo||''}"></div>
      <div class="f"><label>Semana atual (1-16)</label><input type="number" id="gg-semana" min="1" max="16" value="${g.semana_atual||1}"></div>
    </div>`;
}
function openModalGpsGrupo(){
  document.getElementById('modal-title').textContent='Novo Grupo GPS';
  document.getElementById('modal-body').innerHTML=gpsGrupoFormHtml()+`<button class="btn btn-primary btn-full" style="margin-top:8px" onclick="saveGpsGrupo()">Salvar</button>`;
  document.getElementById('modal').classList.remove('hidden');
}
async function editGpsGrupo(id){
  const{data:g}=await db.from('gps_grupos').select('*').eq('id',id).single();
  document.getElementById('modal-title').textContent='Editar Grupo GPS';
  document.getElementById('modal-body').innerHTML=gpsGrupoFormHtml(g)+`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-primary" style="flex:1" onclick="updateGpsGrupo('${id}')">Salvar</button><button class="btn btn-danger" onclick="desativarGpsGrupo('${id}')">Desativar</button></div>`;
  document.getElementById('modal').classList.remove('hidden');
}
function getGpsGrupoData(){
  return{
    nome:gv('gg-nome'),
    lider_id:gv('gg-lider')||null,
    anfitriao_id:gv('gg-anfitriao')||null,
    professor_criancas_id:gv('gg-prof')||null,
    dia_semana:gv('gg-dia'),
    horario:gv('gg-hora'),
    endereco:gv('gg-end'),
    data_inicio_ciclo:gv('gg-inicio')||null,
    semana_atual:parseInt(gv('gg-semana'))||1,
  };
}
async function saveGpsGrupo(){
  if(!gv('gg-nome')){toast('Informe o nome do grupo.');return;}
  const{error}=await db.from('gps_grupos').insert({...getGpsGrupoData(),ativo:true});
  if(error){toast('Erro ao salvar: '+error.message,5000);console.error('saveGpsGrupo',error);return;}
  toast('Grupo GPS criado!');closeModal();renderGPS();
}
async function updateGpsGrupo(id){
  const{error}=await db.from('gps_grupos').update(getGpsGrupoData()).eq('id',id);
  if(error){toast('Erro ao salvar: '+error.message,5000);console.error('updateGpsGrupo',error);return;}
  toast('Atualizado!');closeModal();
  if(window._gpsGrupoAtual===id)abrirGpsGrupo(id);else renderGPS();
}
async function desativarGpsGrupo(id){
  if(!confirm('Desativar este grupo GPS? Ele deixará de aparecer na lista.'))return;
  await db.from('gps_grupos').update({ativo:false}).eq('id',id);
  toast('Grupo desativado.');closeModal();renderGPS();
}

// ── GPS: detalhe do grupo (participantes + relatórios semanais)
async function abrirGpsGrupo(id){
  window._gpsGrupoAtual=id;
  const c=document.getElementById('content');
  c.innerHTML=`<div class="empty-state">Carregando…</div>`;
  const[{data:g},{data:parts},{data:rels}]=await Promise.all([
    db.from('gps_grupos').select('*').eq('id',id).single(),
    db.from('gps_participantes').select('*').eq('grupo_id',id).order('nome'),
    db.from('gps_relatorios_semanais').select('*').eq('grupo_id',id).order('semana',{ascending:false}),
  ]);
  const volNome=vid=>allVols.find(v=>v.id===vid)?.nome||'—';
  const participantes=parts||[];
  const relatorios=rels||[];
  const fase=gpsFaseAtual(g.semana_atual||1);
  const contagem={amigo:0,etiope:0,felipe:0};
  participantes.forEach(p=>{if(contagem[p.categoria]!==undefined)contagem[p.categoria]++;});

  let html=`<div class="sec-actions"><button class="btn btn-secondary btn-sm" onclick="renderGPS()">◀ Voltar</button><h2 style="margin-left:4px">${g.nome}</h2></div>
  <div class="card">
    <div class="card-title">Sobre o grupo</div>
    <div class="membro-detalhe">👤 Líder: ${volNome(g.lider_id)}</div>
    <div class="membro-detalhe">🏠 Anfitrião: ${volNome(g.anfitriao_id)}</div>
    <div class="membro-detalhe">🧒 Professor de Crianças: ${volNome(g.professor_criancas_id)}</div>
    ${g.endereco?`<div class="membro-detalhe">📍 ${g.endereco}</div>`:''}
    ${g.dia_semana||g.horario?`<div class="membro-detalhe">🗓 ${g.dia_semana||''} ${g.horario||''}</div>`:''}
    <div class="membro-detalhe">📅 Semana ${g.semana_atual||1}/16 · ${fase.nome}</div>
    <div class="membro-actions" style="margin-top:10px">
      <button class="btn btn-secondary btn-sm" onclick="editGpsGrupo('${id}')">✏️ Editar grupo</button>
      ${(g.semana_atual||1)<16?`<button class="btn btn-secondary btn-sm" onclick="avancarSemanaGps('${id}',${g.semana_atual||1})">➡️ Avançar semana</button>`:'<span class="badge badge-green">✓ Ciclo completo</span>'}
    </div>
  </div>

  <div class="sec-actions"><h2>Participantes</h2><button class="btn btn-primary btn-sm" onclick="openModalGpsParticipante('${id}')">+ Novo</button></div>
  <div class="metric-grid">
    <div class="metric"><div class="metric-label">Amigos</div><div class="metric-value">${contagem.amigo}</div></div>
    <div class="metric"><div class="metric-label">Etíopes</div><div class="metric-value">${contagem.etiope}</div></div>
    <div class="metric"><div class="metric-label">Felipes</div><div class="metric-value">${contagem.felipe}</div></div>
  </div>`;
  if(!participantes.length){html+=`<div class="card"><div class="empty-state"><div class="empty-icon">👥</div>Nenhum participante cadastrado ainda.</div></div>`;}
  else{
    participantes.forEach(p=>{
      const wpp=wppLink(p.telefone);
      html+=`<div class="membro-card" style="align-items:center">
        <div class="membro-avatar-ph">👤</div>
        <div class="membro-info">
          <div class="membro-nome">${p.nome} <span class="badge ${GPS_CAT_BADGE[p.categoria]||'badge-gray'}">${GPS_CATS[p.categoria]||p.categoria}</span></div>
          ${p.telefone?`<div class="membro-detalhe">📱 ${p.telefone}</div>`:''}
          <div class="membro-actions">
            ${wpp?`<a href="${wpp}" target="_blank" class="btn btn-wpp btn-sm" style="text-decoration:none">💬</a>`:''}
            <button class="btn btn-secondary btn-sm" onclick="editGpsParticipante('${p.id}','${id}')">Editar</button>
            <button class="btn btn-danger btn-sm" onclick="removerGpsParticipante('${p.id}','${id}')">Remover</button>
          </div>
        </div>
      </div>`;
    });
  }

  html+=`<div class="sec-actions"><h2>Relatórios semanais</h2><button class="btn btn-primary btn-sm" onclick="openModalGpsRelatorio('${id}',${g.semana_atual||1})">+ Novo relatório</button></div>`;
  if(!relatorios.length){html+=`<div class="card"><div class="empty-state"><div class="empty-icon">📝</div>Nenhum relatório semanal registrado ainda.</div></div>`;}
  else{
    relatorios.forEach(r=>{
      html+=`<div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center"><strong>Semana ${r.semana}</strong>${r.data?`<span class="membro-detalhe">${fmtDate(r.data)}</span>`:''}</div>
        <div class="membro-detalhe">✅ Presentes: ${r.presentes??0} · ❌ Ausentes: ${r.ausentes??0} · 🆕 Visitantes: ${r.visitantes??0}</div>
        ${r.motivo_ausencias?`<div class="membro-detalhe">Motivo das ausências: ${r.motivo_ausencias}</div>`:''}
        ${r.observacoes?`<div class="membro-detalhe">${r.observacoes}</div>`:''}
      </div>`;
    });
  }
  c.innerHTML=html;
}

async function avancarSemanaGps(id,semanaAtual){
  const nova=Math.min(16,semanaAtual+1);
  await db.from('gps_grupos').update({semana_atual:nova}).eq('id',id);
  toast(`Semana atualizada para ${nova}/16.`);
  abrirGpsGrupo(id);
}

function openModalGpsParticipante(grupoId){
  document.getElementById('modal-title').textContent='Novo Participante';
  document.getElementById('modal-body').innerHTML=gpsParticipanteFormHtml()+`<button class="btn btn-primary btn-full" style="margin-top:8px" onclick="saveGpsParticipante('${grupoId}')">Salvar</button>`;
  document.getElementById('modal').classList.remove('hidden');
}
async function editGpsParticipante(id,grupoId){
  const{data:p}=await db.from('gps_participantes').select('*').eq('id',id).single();
  document.getElementById('modal-title').textContent='Editar Participante';
  document.getElementById('modal-body').innerHTML=gpsParticipanteFormHtml(p)+`<button class="btn btn-primary btn-full" style="margin-top:8px" onclick="updateGpsParticipante('${id}','${grupoId}')">Salvar</button>`;
  document.getElementById('modal').classList.remove('hidden');
}
function getGpsParticipanteData(){return{nome:gv('gp-nome'),telefone:gv('gp-tel'),categoria:gv('gp-cat')||'amigo',data_entrada:gv('gp-entrada')||null,observacoes:gv('gp-obs')};}
async function saveGpsParticipante(grupoId){
  if(!gv('gp-nome')){toast('Informe o nome.');return;}
  const{error}=await db.from('gps_participantes').insert({...getGpsParticipanteData(),grupo_id:grupoId});
  if(error){toast('Erro ao salvar: '+error.message,5000);console.error('saveGpsParticipante',error);return;}
  toast('Participante adicionado!');closeModal();abrirGpsGrupo(grupoId);
}
async function updateGpsParticipante(id,grupoId){
  const{error}=await db.from('gps_participantes').update(getGpsParticipanteData()).eq('id',id);
  if(error){toast('Erro ao salvar: '+error.message,5000);console.error('updateGpsParticipante',error);return;}
  toast('Atualizado!');closeModal();abrirGpsGrupo(grupoId);
}
async function removerGpsParticipante(id,grupoId){
  if(!confirm('Remover este participante do grupo?'))return;
  await db.from('gps_participantes').delete().eq('id',id);
  toast('Participante removido.');abrirGpsGrupo(grupoId);
}
