function openModalGpsRelatorio(grupoId,semanaAtual){
  document.getElementById('modal-title').textContent='Novo Relatório Semanal';
  document.getElementById('modal-body').innerHTML=gpsRelatorioFormHtml(semanaAtual)+`<button class="btn btn-primary btn-full" style="margin-top:8px" onclick="saveGpsRelatorio('${grupoId}')">Salvar</button>`;
  document.getElementById('modal').classList.remove('hidden');
}
async function saveGpsRelatorio(grupoId){
  const semana=parseInt(gv('gr-semana'))||1;
  const{error}=await db.from('gps_relatorios_semanais').insert({
    grupo_id:grupoId,
    semana,
    data:gv('gr-data')||null,
    presentes:parseInt(gv('gr-pres'))||0,
    ausentes:parseInt(gv('gr-aus'))||0,
    visitantes:parseInt(gv('gr-vis'))||0,
    motivo_ausencias:gv('gr-motivo'),
    observacoes:gv('gr-obs'),
    created_by:currentUser.id,
  });
  if(error){toast('Erro ao salvar: '+error.message,5000);console.error('saveGpsRelatorio',error);return;}
  toast('Relatório salvo!');closeModal();abrirGpsGrupo(grupoId);
}

// ── FINANCEIRO
const FIN_CATS_ENTRADA=['Ofertas (culto regular)','Doações (membros e colaboradores)','Venda Bistrô (reuniões)','Dízimos recebidos','Outras entradas'];
const FIN_CATS_GASTO=['Gastos com Eventos / Vigílias','Gastos com Retiro 2027','Material de Bistrô (insumos)','Material de Divulgação','Som / Mídia / Equipe técnica','Transporte / Deslocamento','Outros Gastos'];
const FIN_MESES=[
  {key:'2026-06',label:'Jun/26'},{key:'2026-07',label:'Jul/26'},{key:'2026-08',label:'Ago/26'},
  {key:'2026-09',label:'Set/26'},{key:'2026-10',label:'Out/26'},{key:'2026-11',label:'Nov/26'},
  {key:'2026-12',label:'Dez/26'},{key:'2027-01',label:'Jan/27'},{key:'2027-02',label:'Fev/27'},
  {key:'2027-03',label:'Mar/27'},{key:'2027-04',label:'Abr/27'},{key:'2027-05',label:'Mai/27'},
  {key:'2027-06',label:'Jun/27'}
];
function fmtBRL(v){return'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function mesRefAtual(){const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;}

async function renderFinanceiro(){
  const c=document.getElementById('content');
  c.innerHTML='<div class="card"><div class="empty-state">Carregando...</div></div>';
  const tabs=`<div class="tab-bar">
    <button class="tab active" onclick="switchFinTab('lancamentos',this)">📝 Lançamentos</button>
    <button class="tab" onclick="switchFinTab('resumo',this)">📊 Resumo Anual</button>
  </div>`;
  c.innerHTML=tabs+`<div id="fin-tab-content"></div>`;
  renderFinLancamentos();
}

function switchFinTab(tab,btn){
  document.querySelectorAll('#content .tab-bar .tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='lancamentos')renderFinLancamentos();
  else renderFinResumo();
}

async function renderFinLancamentos(){
  const mesAtual=mesRefAtual();
  const mesSel=window._finMesSel||mesAtual;
  window._finMesSel=mesSel;
  const{data:rows}=await db.from('financeiro').select('*').eq('mes_ref',mesSel).order('data',{ascending:true});
  const lancamentos=rows||[];

  const mesOpts=FIN_MESES.map(m=>`<option value="${m.key}"${m.key===mesSel?' selected':''}>${m.label}</option>`).join('');

  let html=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <select onchange="window._finMesSel=this.value;renderFinLancamentos()" style="font-size:13px;padding:7px 10px;border:1px solid var(--g200);border-radius:var(--rs);background:#fff;font-family:inherit">${mesOpts}</select>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openModalFinLanc()">+ Novo lançamento</button>
  </div>`;

  // Totais do mês
  const totalE=lancamentos.filter(x=>x.tipo==='entrada').reduce((s,x)=>s+(x.valor||0),0);
  const totalG=lancamentos.filter(x=>x.tipo==='gasto').reduce((s,x)=>s+(x.valor||0),0);
  const saldo=totalE-totalG;
  html+=`<div class="metric-grid">
    <div class="metric"><div class="metric-label">Entradas</div><div class="metric-value" style="font-size:18px;color:#1a7a2e">${fmtBRL(totalE)}</div></div>
    <div class="metric"><div class="metric-label">Gastos</div><div class="metric-value" style="font-size:18px;color:#c00">${fmtBRL(totalG)}</div></div>
    <div class="metric"><div class="metric-label">Saldo do mês</div><div class="metric-value" style="font-size:18px;color:${saldo>=0?'#1a7a2e':'#c00'}">${fmtBRL(saldo)}</div></div>
  </div>`;

  // Tabela de lançamentos
  html+=`<div class="card"><div class="card-title">Lançamentos — ${FIN_MESES.find(m=>m.key===mesSel)?.label||mesSel}</div>`;
  if(!lancamentos.length){
    html+=`<div class="empty-state"><div class="empty-icon">💰</div>Nenhum lançamento neste mês.<br><small>Clique em "+ Novo lançamento" para começar.</small></div>`;
  } else {
    html+=`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th>Obs.</th><th></th></tr></thead><tbody>`;
    lancamentos.forEach(l=>{
      const isE=l.tipo==='entrada';
      html+=`<tr>
        <td style="white-space:nowrap">${l.data?new Date(l.data+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'—'}</td>
        <td class="td-name">${l.descricao||'—'}</td>
        <td><span style="font-size:11px;color:var(--g600)">${l.categoria||'—'}</span></td>
        <td><span class="badge ${isE?'badge-green':'badge-red'}">${isE?'Entrada':'Gasto'}</span></td>
        <td style="font-weight:600;color:${isE?'#1a7a2e':'#c00'};white-space:nowrap">${fmtBRL(l.valor)}</td>
        <td style="font-size:11px;color:var(--g400);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.observacoes||''}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteFinLanc('${l.id}')">✕</button></td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  }
  html+=`</div>`;
  document.getElementById('fin-tab-content').innerHTML=html;
}

async function renderFinResumo(){
  const{data:rows}=await db.from('financeiro').select('*');
  const todos=rows||[];

  // Agrupa por mês
  const porMes={};
  FIN_MESES.forEach(m=>{porMes[m.key]={entradas:{},gastos:{}};FIN_CATS_ENTRADA.forEach(c=>{porMes[m.key].entradas[c]=0;});FIN_CATS_GASTO.forEach(c=>{porMes[m.key].gastos[c]=0;});});
  todos.forEach(l=>{
    if(!porMes[l.mes_ref])return;
    if(l.tipo==='entrada'&&FIN_CATS_ENTRADA.includes(l.categoria))porMes[l.mes_ref].entradas[l.categoria]=(porMes[l.mes_ref].entradas[l.categoria]||0)+(l.valor||0);
    if(l.tipo==='gasto'&&FIN_CATS_GASTO.includes(l.categoria))porMes[l.mes_ref].gastos[l.categoria]=(porMes[l.mes_ref].gastos[l.categoria]||0)+(l.valor||0);
  });

  // Totais gerais
  const totalEAno=todos.filter(x=>x.tipo==='entrada').reduce((s,x)=>s+(x.valor||0),0);
  const totalGAno=todos.filter(x=>x.tipo==='gasto').reduce((s,x)=>s+(x.valor||0),0);
  const saldoAno=totalEAno-totalGAno;

  let html=`<div class="metric-grid">
    <div class="metric"><div class="metric-label">Total Entradas (ano)</div><div class="metric-value" style="font-size:16px;color:#1a7a2e">${fmtBRL(totalEAno)}</div></div>
    <div class="metric"><div class="metric-label">Total Gastos (ano)</div><div class="metric-value" style="font-size:16px;color:#c00">${fmtBRL(totalGAno)}</div></div>
    <div class="metric"><div class="metric-label">Saldo Acumulado</div><div class="metric-value" style="font-size:16px;color:${saldoAno>=0?'#1a7a2e':'#c00'}">${fmtBRL(saldoAno)}</div></div>
  </div>`;

  // Tabela de entradas
  html+=`<div class="card"><div class="card-title">▶ Entradas por categoria</div><div class="tbl-wrap"><table>
    <thead><tr><th>Categoria</th>${FIN_MESES.map(m=>`<th style="white-space:nowrap">${m.label}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  FIN_CATS_ENTRADA.forEach(cat=>{
    const vals=FIN_MESES.map(m=>porMes[m.key].entradas[cat]||0);
    const tot=vals.reduce((s,v)=>s+v,0);
    html+=`<tr><td style="font-size:12px">${cat}</td>${vals.map(v=>`<td style="text-align:right;font-size:12px;color:${v>0?'#1a7a2e':'var(--g400)'}">${v>0?fmtBRL(v):'—'}</td>`).join('')}<td style="text-align:right;font-size:12px;font-weight:600;color:${tot>0?'#1a7a2e':'var(--g400)'}">${tot>0?fmtBRL(tot):'—'}</td></tr>`;
  });
  // Total entradas linha
  const totEntMes=FIN_MESES.map(m=>FIN_CATS_ENTRADA.reduce((s,c)=>s+(porMes[m.key].entradas[c]||0),0));
  html+=`<tr style="background:var(--g50);font-weight:700"><td>TOTAL ENTRADAS</td>${totEntMes.map(v=>`<td style="text-align:right;font-size:12px;color:#1a7a2e">${v>0?fmtBRL(v):'—'}</td>`).join('')}<td style="text-align:right;font-size:12px;color:#1a7a2e">${fmtBRL(totEntMes.reduce((s,v)=>s+v,0))}</td></tr>`;
  html+=`</tbody></table></div></div>`;

  // Tabela de gastos
  html+=`<div class="card"><div class="card-title">▶ Gastos por categoria</div><div class="tbl-wrap"><table>
    <thead><tr><th>Categoria</th>${FIN_MESES.map(m=>`<th style="white-space:nowrap">${m.label}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  FIN_CATS_GASTO.forEach(cat=>{
    const vals=FIN_MESES.map(m=>porMes[m.key].gastos[cat]||0);
    const tot=vals.reduce((s,v)=>s+v,0);
    html+=`<tr><td style="font-size:12px">${cat}</td>${vals.map(v=>`<td style="text-align:right;font-size:12px;color:${v>0?'#c00':'var(--g400)'}">${v>0?fmtBRL(v):'—'}</td>`).join('')}<td style="text-align:right;font-size:12px;font-weight:600;color:${tot>0?'#c00':'var(--g400)'}">${tot>0?fmtBRL(tot):'—'}</td></tr>`;
  });
  const totGasMes=FIN_MESES.map(m=>FIN_CATS_GASTO.reduce((s,c)=>s+(porMes[m.key].gastos[c]||0),0));
  html+=`<tr style="background:var(--g50);font-weight:700"><td>TOTAL GASTOS</td>${totGasMes.map(v=>`<td style="text-align:right;font-size:12px;color:#c00">${v>0?fmtBRL(v):'—'}</td>`).join('')}<td style="text-align:right;font-size:12px;color:#c00">${fmtBRL(totGasMes.reduce((s,v)=>s+v,0))}</td></tr>`;
  html+=`</tbody></table></div></div>`;

  // Saldos mensais
  html+=`<div class="card"><div class="card-title">💰 Saldo mensal e acumulado</div><div class="tbl-wrap"><table>
    <thead><tr><th>Mês</th><th style="text-align:right">Entradas</th><th style="text-align:right">Gastos</th><th style="text-align:right">Saldo do Mês</th><th style="text-align:right">Saldo Acumulado</th></tr></thead><tbody>`;
  let acum=0;
  FIN_MESES.forEach((m,i)=>{
    const e=totEntMes[i];const g=totGasMes[i];const s=e-g;acum+=s;
    html+=`<tr>
      <td style="font-weight:500">${m.label}</td>
      <td style="text-align:right;color:#1a7a2e">${e>0?fmtBRL(e):'—'}</td>
      <td style="text-align:right;color:#c00">${g>0?fmtBRL(g):'—'}</td>
      <td style="text-align:right;font-weight:600;color:${s>=0?'#1a7a2e':'#c00'}">${(e>0||g>0)?fmtBRL(s):'—'}</td>
      <td style="text-align:right;font-weight:600;color:${acum>=0?'#1a7a2e':'#c00'}">${acum!==0?fmtBRL(acum):'—'}</td>
    </tr>`;
  });
  html+=`</tbody></table></div></div>`;
  document.getElementById('fin-tab-content').innerHTML=html;
}

function openModalFinLanc(id){
  document.getElementById('modal-title').textContent='Novo Lançamento';
  const mesOpts=FIN_MESES.map(m=>`<option value="${m.key}"${m.key===(window._finMesSel||mesRefAtual())?' selected':''}>${m.label}</option>`).join('');
  const entOpts=FIN_CATS_ENTRADA.map(c=>`<option value="${c}">${c}</option>`).join('');
  const gasOpts=FIN_CATS_GASTO.map(c=>`<option value="${c}">${c}</option>`).join('');
  document.getElementById('modal-body').innerHTML=`
    <div class="f"><label>Mês de referência</label><select id="fl-mes">${mesOpts}</select></div>
    <div class="f"><label>Data</label><input type="date" id="fl-data"></div>
    <div class="f"><label>Descrição</label><input type="text" id="fl-desc" placeholder="Ex: Oferta culto dominical"></div>
    <div class="f"><label>Tipo</label>
      <select id="fl-tipo" onchange="updateFinCatOpts()">
        <option value="entrada">Entrada</option>
        <option value="gasto">Gasto</option>
      </select>
    </div>
    <div class="f"><label>Categoria</label><select id="fl-cat">${entOpts}</select></div>
    <div class="f"><label>Valor (R$)</label><input type="number" id="fl-valor" placeholder="0,00" min="0" step="0.01"></div>
    <div class="f"><label>Observações <span style="color:var(--g400)">(opcional)</span></label><input type="text" id="fl-obs" placeholder="Detalhes adicionais..."></div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="saveFinLanc()">Salvar lançamento</button>
    <div id="fl-err" style="color:#c00;font-size:13px;margin-top:8px"></div>`;
  document.getElementById('modal').classList.remove('hidden');
}

function updateFinCatOpts(){
  const tipo=document.getElementById('fl-tipo').value;
  const cats=tipo==='entrada'?FIN_CATS_ENTRADA:FIN_CATS_GASTO;
  document.getElementById('fl-cat').innerHTML=cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

async function saveFinLanc(){
  const mes=gv('fl-mes'),data=gv('fl-data'),desc=gv('fl-desc').trim(),tipo=gv('fl-tipo'),cat=gv('fl-cat'),valor=parseFloat(gv('fl-valor')),obs=gv('fl-obs').trim();
  const err=document.getElementById('fl-err');
  if(!mes||!data||!desc||!tipo||!cat||isNaN(valor)||valor<=0){err.textContent='Preencha todos os campos obrigatórios e informe um valor válido.';return;}
  const{error}=await db.from('financeiro').insert({mes_ref:mes,data,descricao:desc,tipo,categoria:cat,valor,observacoes:obs||null,created_by:currentUser.id});
  if(error){err.textContent='Erro ao salvar: '+error.message;return;}
  toast('Lançamento registrado!');closeModal();window._finMesSel=mes;renderFinLancamentos();
}

async function deleteFinLanc(id){
  if(!confirm('Excluir este lançamento?'))return;
  await db.from('financeiro').delete().eq('id',id);
  toast('Lançamento excluído.');renderFinLancamentos();
}

// ── USUÁRIOS
async function renderUsuarios(){
  const tabs=`<div class="tab-bar"><button class="tab active" onclick="switchUserTab('usuarios',this)">Usuários</button><button class="tab" onclick="switchUserTab('avisos',this)">Avisos</button></div>`;
  document.getElementById('content').innerHTML=tabs+`<div id="user-tab-content"></div>`;
  renderUsuariosList();
}
function switchUserTab(tab,btn){
  document.querySelectorAll('.tab-bar .tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='usuarios')renderUsuariosList();
  else renderAvisos();
}
async function renderUsuariosList(){
  const{data:users}=await db.from('perfis').select('*').order('nome');
  let html=`<div class="sec-actions"><h2>Usuários</h2><button class="btn btn-primary btn-sm" onclick="openModalUser()">+ Novo</button></div><div class="card">`;
  if(!users||!users.length)html+=`<div class="empty-state"><div class="empty-icon">🔑</div>Nenhum usuário.</div>`;
  else users.forEach(u=>{
    const url=fotoUrl(u.foto_url);
    html+=`<div class="user-row">
      <div style="display:flex;align-items:center;gap:10px">
        ${url?`<img src="${url}" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`:`<div style="width:36px;height:36px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:14px">👤</div>`}
        <div><div class="u-name">${u.nome}</div><div class="u-email">${u.email||'—'} · <span class="badge badge-gray">${ROLE_LABELS[u.role]||u.role}</span></div></div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="deleteUser('${u.id}','${u.nome}')">Remover</button>
    </div>`;
  });
  html+=`</div>`;
  document.getElementById('user-tab-content').innerHTML=html;
}
function openModalUser(){
  document.getElementById('modal-title').textContent='Novo Usuário';
  document.getElementById('modal-body').innerHTML=`
    <div class="foto-upload-wrap" style="margin-bottom:14px">
      <div class="foto-preview-placeholder" id="nu-foto-preview">👤</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <input type="file" id="nu-foto-input" accept="image/*" style="display:none" onchange="previewFoto('nu-foto-input','nu-foto-preview')">
        <input type="file" id="nu-foto-cam" accept="image/*" capture="environment" style="display:none" onchange="previewFotoFrom('nu-foto-cam','nu-foto-preview','nu-foto-input')">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('nu-foto-input').click()">🖼 Galeria</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('nu-foto-cam').click()">📷 Câmera</button>
      </div>
    </div>
    <div class="f"><label>Nome</label><input type="text" id="nu-nome" placeholder="Nome completo"></div>
    <div class="f"><label>Email</label><input type="email" id="nu-email" placeholder="email@email.com"></div>
    <div class="f"><label>Senha</label><input type="password" id="nu-senha" placeholder="Mínimo 6 caracteres"></div>
    <div class="f"><label>Perfil de acesso</label>
      <select id="nu-role">
        <option value="coordenador">Coordenador</option>
        <option value="lideranca">Liderança</option>
        <option value="recepcao">Recepção</option>
        <option value="bistro">Bistrô</option>
        <option value="midia">Mídia</option>
        <option value="financeiro">Financeiro</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="saveUser()">Criar usuário</button>
    <div id="user-err" style="color:#c00;font-size:13px;margin-top:8px"></div>`;
  document.getElementById('modal').classList.remove('hidden');
}
async function saveUser(){
  const nome=gv('nu-nome').trim(),email=gv('nu-email').trim(),senha=gv('nu-senha'),role=gv('nu-role');
  const err=document.getElementById('user-err');
  if(!nome||!email||!senha){err.textContent='Preencha todos os campos.';return;}
  if(senha.length<6){err.textContent='Senha mínima de 6 caracteres.';return;}
  const{data,error}=await db.auth.signUp({email,password:senha});
  if(error){err.textContent='Erro: '+error.message;return;}
  const uid=data?.user?.id;
  if(!uid){err.textContent='Erro ao obter ID do usuário.';return;}
  let foto_url=null;
  const fi=document.getElementById('nu-foto-input');
  if(fi?.files[0])foto_url=await uploadFoto(fi.files[0],'perfis');
  await db.from('perfis').upsert({id:uid,nome,email,role,foto_url});
  toast('Usuário criado!');closeModal();renderUsuariosList();
}
async function deleteUser(id,nome){
  if(!confirm(`Remover ${nome}? O acesso ao sistema será bloqueado.`))return;
  await db.from('perfis').delete().eq('id',id);
  toast('Acesso removido. Para excluir do Auth, acesse o painel Supabase.');renderUsuariosList();
}

// ── TROCAR SENHA
function openModalSenha(){
  document.getElementById('modal-title').textContent='Trocar Senha';
  document.getElementById('modal-body').innerHTML=`
    <div class="f"><label>Nova senha</label><input type="password" id="ns-nova" placeholder="Mínimo 6 caracteres"></div>
    <div class="f"><label>Confirmar nova senha</label><input type="password" id="ns-conf" placeholder="Repita a senha"></div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="saveSenha()">Salvar senha</button>
    <div id="ns-err" style="color:#c00;font-size:13px;margin-top:8px"></div>`;
  document.getElementById('modal').classList.remove('hidden');
}
async function saveSenha(){
  const nova=gv('ns-nova'),conf=gv('ns-conf');
  const err=document.getElementById('ns-err');
  if(!nova||nova.length<6){err.textContent='A senha precisa ter pelo menos 6 caracteres.';return;}
  if(nova!==conf){err.textContent='As senhas não coincidem.';return;}
  err.textContent='Salvando...';
  const{error}=await db.auth.updateUser({password:nova});
  if(error){err.textContent='Erro: '+error.message;return;}
  toast('Senha alterada com sucesso!');closeModal();
}

// ── FOTO DE PERFIL
function openModalFotoPerfil(){
  document.getElementById('modal-title').textContent='Minha Foto de Perfil';
  const url=fotoUrl(currentProfile?.foto_url);
  document.getElementById('modal-body').innerHTML=`
    <div style="text-align:center;margin-bottom:16px">
      ${url?`<img src="${url}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:2px solid var(--g200)" id="pp-preview">`:`<div style="width:100px;height:100px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto;border:2px dashed var(--g200)" id="pp-preview">👤</div>`}
    </div>
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
      <input type="file" id="pp-input" accept="image/*" style="display:none" onchange="previewFoto('pp-input','pp-preview')">
      <input type="file" id="pp-cam" accept="image/*" capture="environment" style="display:none" onchange="previewFotoFrom('pp-cam','pp-preview','pp-input')">
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('pp-input').click()">🖼 Galeria</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('pp-cam').click()">📷 Câmera</button>
    </div>
    <button class="btn btn-primary btn-full" onclick="saveFotoPerfil()">Salvar foto</button>
    <div id="pp-err" style="color:#c00;font-size:13px;margin-top:8px"></div>`;
  document.getElementById('modal').classList.remove('hidden');
}
async function saveFotoPerfil(){
  const fi=document.getElementById('pp-input');
  const err=document.getElementById('pp-err');
  if(!fi?.files[0]){err.textContent='Selecione uma foto primeiro.';return;}
  err.textContent='Enviando...';
  const foto_url=await uploadFoto(fi.files[0],'perfis');
  if(!foto_url){err.textContent='Erro no upload.';return;}
  await db.from('perfis').update({foto_url}).eq('id',currentUser.id);
  currentProfile={...currentProfile,foto_url};
  // Update sidebar avatar
  const fw=document.getElementById('sb-avatar-wrap');
  fw.innerHTML=`<img src="${fotoUrl(foto_url)}" class="sb-avatar">`;
  toast('Foto atualizada!');closeModal();
}

function closeModal(){document.getElementById('modal').classList.add('hidden');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
document.getElementById('l-senha').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
db.auth.getSession().then(({data:{session}})=>{if(session){currentUser=session.user;initApp();}});
</script>
